name: Release Branch CI

on:
  push:
    branches:
      - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check Flutter
        run: flutter --version

      - name: Get Pub dependencies
        run: flutter pub get

      - name: Verify static analysis
        run: flutter analyze
        continue-on-error: true